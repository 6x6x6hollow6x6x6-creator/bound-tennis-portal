    <text x="256" y="300" font-size="170" font-weight="900" fill="#F1F1F1" text-anchor="middle" letter-spacing="-6" font-family="Arial Black, sans-serif">BTP</text>
    <rect x="110" y="340" width="292" height="18" rx="9" fill="#B50000"/>
  </g>
</svg>
